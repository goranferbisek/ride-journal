services:
  postgres:
    image: postgres:18
    container_name: ride-journal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rideJournal
      POSTGRES_USER: rideJournal
      POSTGRES_PASSWORD: rideJournal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
