name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: rideJournal
          POSTGRES_USER: rideJournal
          POSTGRES_PASSWORD: rideJournal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - run: ./gradlew test build
      - uses: actions/upload-artifact@v5
        with:
          name: backend-jar
          path: backend/build/libs/*.jar

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npx vitest run --passWithNoTests
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/